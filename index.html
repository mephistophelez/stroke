<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Einfach-Tablet</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1d1f;--muted:#6e6e73;--line:#e3e3e8;--green:#1f9d55;--red:#d64545;
  --y:#FFEDB3;--yb:#E3BF4F;--b:#D3EAFF;--bb:#79B0E3;--p:#FFDCE4;--pb:#E991A8;
  --g:#D8F4D8;--gb:#7FC97F;--v:#E8E0FF;--vb:#A38FE3;--o:#FFE3CC;--ob:#EBA266;
  --gap:clamp(10px,2vmin,22px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.c-y{background:var(--y);border-color:var(--yb)}.c-b{background:var(--b);border-color:var(--bb)}
.c-p{background:var(--p);border-color:var(--pb)}.c-g{background:var(--g);border-color:var(--gb)}
.c-v{background:var(--v);border-color:var(--vb)}.c-o{background:var(--o);border-color:var(--ob)}

/* Kopfleiste */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:var(--gap);padding:var(--gap)}
.backbtn{flex:0 0 auto;width:clamp(90px,15vmin,150px);height:clamp(70px,11vmin,110px);border-radius:28px;
  border:4px solid #c7c7cd;background:#f2f2f5;font-size:clamp(40px,7vmin,64px);
  display:flex;align-items:center;justify-content:center}
.bar .title{flex:1;font-size:clamp(26px,5vmin,48px);font-weight:800;display:flex;gap:16px;align-items:center;min-width:0}
.bar .title span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barbtn{flex:0 0 auto;width:clamp(80px,13vmin,130px);height:clamp(70px,11vmin,110px);border-radius:28px;
  border:4px solid var(--bb);background:var(--b);font-size:clamp(36px,6vmin,58px);display:flex;align-items:center;justify-content:center}
.main{flex:1 1 auto;min-height:0;padding:0 var(--gap) var(--gap);position:relative}

/* Kacheln */
.tiles{height:100%;display:grid;gap:var(--gap);grid-auto-rows:1fr}
.tile{border-radius:36px;border-width:5px;border-style:solid;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;font-weight:800;font-size:clamp(22px,4.2vmin,44px);text-align:center;padding:8px;
  transition:transform .08s, opacity .3s;min-height:0;overflow:hidden}
.tile .ic{font-size:clamp(56px,14vmin,150px);line-height:1.05}
.pressed{transform:scale(.95);filter:brightness(.94)}

/* Start */
.home{height:100%;display:flex;flex-direction:column;padding:var(--gap);gap:var(--gap)}
.clock{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,48px);flex-wrap:wrap;padding-top:4px}
.time{font-size:clamp(60px,14vmin,150px);font-weight:800;line-height:1;letter-spacing:-2px}
.date{font-size:clamp(26px,5.5vmin,56px);font-weight:800;line-height:1.1}
.date2{font-size:clamp(20px,4vmin,40px);color:#444;margin-top:4px}
.grid4{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:var(--gap)}
@media (orientation:landscape){.grid4{grid-template-columns:repeat(4,1fr)}}
.home5 .tile:last-child{grid-column:span 2}
@media (orientation:landscape){.grid4.home5{grid-template-columns:repeat(5,1fr)}.home5 .tile:last-child{grid-column:auto}}
/* Schreiben */
.wmain{display:flex;flex-direction:column;gap:var(--gap)}
.wtop{display:flex;gap:var(--gap);flex:0 0 24%;min-height:0}
.wtext{flex:1;min-width:0;border:4px solid var(--line);border-radius:24px;padding:10px 18px;font-size:clamp(28px,5.5vmin,56px);font-weight:600;
  overflow-y:auto;line-height:1.25;word-break:break-word;white-space:pre-wrap}
.wtext .ph{color:#c7c7cd}
.caret{display:inline-block;width:4px;height:1em;background:var(--ink);vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wbtns{display:flex;gap:var(--gap)}
.wb{width:clamp(76px,13vmin,140px);border-radius:28px;border-width:5px;border-style:solid;display:flex;align-items:center;justify-content:center;font-size:clamp(38px,8vmin,80px)}
.words{display:flex;flex-wrap:wrap;gap:clamp(6px,1.2vmin,10px);flex:0 0 auto}
.chip{padding:8px 16px;border-radius:999px;border:3px solid var(--vb);background:var(--v);font-size:clamp(18px,3vmin,28px);font-weight:700}
.kb{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,1.1vmin,12px)}
.kr{flex:1;display:flex;gap:clamp(5px,1.1vmin,12px);justify-content:center;min-height:0}
.key{flex:1 1 0;max-width:9%;border-radius:16px;border:3px solid #c7c7cd;background:#f7f7f9;display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,4.5vmin,48px);font-weight:700}
.key.k2{flex:2;max-width:none}.key.k6{flex:6;max-width:none}.key.k3{flex:2.5;max-width:none}
.kdel{background:var(--p);border-color:var(--pb)}
.ovltext{max-height:32vh;overflow:auto}
.hint{text-align:center;color:#b0b0b5;font-size:15px}

/* Spiele */
.card{border-radius:28px;border:5px solid var(--bb);background:var(--b);display:flex;align-items:center;justify-content:center;
  font-size:clamp(50px,13vmin,140px);transition:transform .15s, background .2s;min-height:0}
.card .face{opacity:0;transition:opacity .15s}
.card.up{background:#fff}.card.up .face{opacity:1}
.card.done{background:#E6F7E6;border-color:var(--gb)}
.gt{font-size:clamp(60px,17vmin,180px)}
.tile.right{background:#CFF2CF;border-color:var(--green);transform:scale(1.04)}
.tile.wrong{opacity:.25;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.same{height:100%;display:flex;flex-direction:column;gap:var(--gap)}
.target{flex:0 0 38%;display:flex;align-items:center;justify-content:center;border:6px dashed #c7c7cd;border-radius:36px;
  font-size:clamp(70px,22vmin,220px)}
.same .tiles{flex:1;height:auto}
.prompt{text-align:center;font-size:clamp(26px,5vmin,48px)}
#sky{overflow:hidden}
.balloon{position:absolute;font-size:clamp(80px,16vmin,160px);line-height:1;animation:rise linear forwards;touch-action:none;padding:10px}
@keyframes rise{to{transform:translateY(var(--d))}}
.score{position:absolute;right:var(--gap);top:0;font-size:clamp(36px,7vmin,70px);font-weight:800;z-index:2}

/* Bilder */
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,28vmin,260px),1fr));gap:var(--gap)}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;display:block;background:#f2f2f5;pointer-events:none}
.pgrid .ph{border-radius:24px;border:4px solid var(--line)}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9a9aa0;text-align:center;gap:10px;font-size:clamp(20px,4vmin,34px)}
.empty .ic{font-size:clamp(90px,24vmin,220px);opacity:.6}
.viewer{height:100%;position:relative;border-radius:24px;overflow:hidden;background:#f6f6f8}
.viewer img{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:clamp(80px,13vmin,130px);height:clamp(80px,13vmin,130px);
  border-radius:50%;background:rgba(255,255,255,.92);border:4px solid #c7c7cd;font-size:clamp(40px,7vmin,64px);
  display:flex;align-items:center;justify-content:center}
.nav.l{left:14px}.nav.r{right:14px}
.nav.pressed{transform:translateY(-50%) scale(.94)}

/* Malen */
.drawwrap{height:100%;border:4px solid var(--line);border-radius:24px;overflow:hidden;background:#fff}
#cv{display:block;touch-action:none}
.tools{flex:0 0 auto;display:flex;gap:clamp(8px,1.6vmin,16px);justify-content:center;align-items:center;padding:0 var(--gap) var(--gap);flex-wrap:wrap}
.dot{width:clamp(52px,9vmin,88px);height:clamp(52px,9vmin,88px);border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 3px #ccc}
.dot.sel{box-shadow:0 0 0 7px var(--ink)}
.tool{width:clamp(60px,10vmin,96px);height:clamp(60px,10vmin,96px);border-radius:24px;border:4px solid #c7c7cd;background:#f2f2f5;
  font-size:clamp(32px,6vmin,54px);display:flex;align-items:center;justify-content:center}
.tool.sel{border-color:var(--ink);background:#fff}

/* Nachrichten */
.av{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid rgba(0,0,0,.08);flex:0 0 auto}
.ctile .av{width:clamp(90px,20vmin,200px);height:clamp(90px,20vmin,200px);font-size:clamp(54px,12vmin,120px)}
.qt{font-size:clamp(18px,3.4vmin,34px)}
.qt .ic{font-size:clamp(50px,11vmin,120px)}

/* Overlays */
.ovl{position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:50;display:flex;align-items:center;justify-content:center;padding:var(--gap)}
.ovlbox{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,4vmin,40px);width:100%;max-width:1000px}
.ovlbig{display:flex;align-items:center;gap:clamp(12px,3vw,36px);font-size:clamp(70px,16vmin,160px);flex-wrap:wrap;justify-content:center}
.ovltext{font-size:clamp(28px,6vmin,60px);font-weight:800;text-align:center}
.ovlnote{font-size:clamp(16px,2.6vmin,22px);color:var(--muted);text-align:center;max-width:700px}
.ovlbtns{display:flex;gap:clamp(20px,6vw,80px)}
.bigbtn{width:clamp(130px,26vmin,240px);height:clamp(110px,20vmin,190px);border-radius:40px;border:6px solid;
  display:flex;align-items:center;justify-content:center;font-size:clamp(60px,12vmin,120px);color:#fff;text-decoration:none;font-weight:800}
.bigbtn.yes{background:var(--green);border-color:#157a40}
.bigbtn.no{background:#9a9aa0;border-color:#7a7a80}
.celebrate{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;
  gap:40px;font-size:clamp(100px,26vmin,260px);pointer-events:none}
@keyframes bounce{from{transform:translateY(20px) scale(.95)}to{transform:translateY(-20px) scale(1.08)}}

/* Einstellungen (für Angehörige – normale Größe) */
.admin{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:20px;font-size:18px;
  -webkit-user-select:text;user-select:text;max-width:900px;margin:0 auto;width:100%}
.ahead{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:-20px;background:#fff;padding:12px 0;z-index:2;border-bottom:1px solid var(--line)}
.admin h1{font-size:26px;margin:0}.admin h2{font-size:21px;margin:0 0 12px}
.admin section{padding:18px 0;border-bottom:1px solid var(--line)}
.admin label{display:block;margin:10px 0}
.admin input[type=text],.admin input[type=tel],.admin select{display:block;width:100%;max-width:420px;font-size:18px;padding:10px 12px;
  border:2px solid #cfcfd4;border-radius:12px;margin-top:4px;background:#fff;color:var(--ink)}
.admin .chk{display:flex;align-items:center;gap:12px}
.admin .chk input{width:26px;height:26px}
.abtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700;padding:12px 20px;border-radius:14px;
  background:#1d1d1f;color:#fff;border:0;margin:6px 8px 6px 0;cursor:pointer}
.abtn.light{background:#f2f2f5;color:var(--ink);border:2px solid #cfcfd4}
.abtn.red{background:#fff;color:var(--red);border:2px solid var(--red)}
.abtn.sm{font-size:15px;padding:8px 12px}
.crow{display:flex;align-items:center;gap:12px;padding:8px 0}
.crow .av{width:52px;height:52px;font-size:30px}
.crow .meta{flex:1;min-width:0}.crow .meta small{color:var(--muted);display:block}
.emorow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.emorow span{font-size:34px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:14px;border:3px solid transparent;background:#f2f2f5}
.emorow span.sel{border-color:var(--ink);background:#fff}
.msg{color:var(--red);min-height:1.2em}.ok{color:var(--green)}
.note{color:var(--muted);font-size:16px;line-height:1.45}
.prev{width:72px;height:72px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-left:10px}

/* ===== Ruhiges Design für Erwachsene ===== */
:root{--ink:#1F2933;--muted:#5F6B76;--line:#D5DBE1;--green:#2E7D4F;--soft:#F3F5F7}
.c-y,.c-b,.c-p,.c-g,.c-v,.c-o{background:#fff;border-color:var(--line)}
.tile{border-radius:22px;border-width:2px;font-weight:700;letter-spacing:.2px}
.tile.solid{background:var(--k);border-color:var(--k);color:#fff}
.tile.plain{background:#fff;border-color:var(--line)}
.tile .ic .svg{width:clamp(54px,12vmin,128px);height:clamp(54px,12vmin,128px);stroke-width:1.6}
.tile.plain .ic{color:var(--k)}
.qt .ic{font-size:clamp(44px,9vmin,96px)}
.pressed{transform:scale(.97);filter:brightness(.93)}
.time{font-weight:700;letter-spacing:-1px}.date{font-weight:700}.date2{color:var(--muted)}
.backbtn,.barbtn{border-radius:18px;border:2px solid var(--line);background:var(--soft);color:var(--ink)}
.backbtn .svg,.barbtn .svg{width:55%;height:55%;stroke-width:2}
.bar{border-bottom:1px solid var(--line);margin-bottom:var(--gap)}
.bar .title{font-weight:700;gap:14px}.bar .title .svg{width:1.15em;height:1.15em;stroke-width:2}
.card{border-radius:18px;border:2px solid #C9D2DB;background:var(--soft)}
.card.up{background:#fff;border-color:#8A99A8}.card.done{background:#EEF6F0;border-color:#9BC4A8}
.target{border:2px solid var(--line);background:var(--soft);border-radius:22px}
.tile.right{background:#EEF6F0;border-color:var(--green)}
.drawwrap{border:2px solid var(--line);border-radius:18px}
.tool{border-radius:16px;border:2px solid var(--line);background:var(--soft);color:var(--ink)}
.tool .svg{width:58%;height:58%;stroke-width:2}.tool.sel{border-color:var(--ink);background:#fff}
.dot{border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}.dot.sel{box-shadow:0 0 0 5px var(--ink)}
.nav{background:rgba(255,255,255,.95);border:2px solid var(--line);color:var(--ink)}
.nav .svg{width:55%;height:55%;stroke-width:2.2}
.viewer{border-radius:18px;background:var(--soft)}
.pgrid img,.pgrid .ph{border-radius:14px}.pgrid .ph{border:2px solid var(--line)}
.empty .ic .svg{width:clamp(90px,20vmin,180px);height:clamp(90px,20vmin,180px);stroke-width:1.2}
.empty .ic{opacity:1;color:#AEB7C0}
.av{border:2px solid var(--line);background:var(--soft)}
.bigbtn{border-radius:24px;border-width:0}
.bigbtn .svg{width:50%;height:50%;stroke-width:2.6}
.bigbtn.no{background:#E4E8EC;color:var(--ink)}
.ovltext{font-weight:700}
.chip{border:2px solid var(--line);background:#fff;font-weight:700;border-radius:14px}
.key{border-radius:12px;border:2px solid var(--line);background:var(--soft)}
.kdel{background:#F6E9E6;border-color:#E2C4BC}
.wb{border-radius:18px;border-width:0;color:#fff;background:var(--k)}
.wb .svg{width:55%;height:55%;stroke-width:2}
.wtext{border:2px solid var(--line);border-radius:18px;font-weight:400}
.score{font-weight:700;color:var(--muted);font-size:clamp(26px,5vmin,46px)}
.celebrate{background:rgba(255,255,255,.6);animation:fadein .2s}
.cbox{background:#fff;border-radius:28px;padding:clamp(24px,5vmin,48px) clamp(36px,8vmin,80px);box-shadow:0 12px 40px rgba(31,41,51,.18);
  display:flex;flex-direction:column;align-items:center;gap:14px;font-size:clamp(28px,5vmin,48px);font-weight:700;color:var(--ink)}
.cbox .svg{width:clamp(80px,16vmin,140px);height:clamp(80px,16vmin,140px);color:#fff;background:var(--green);border-radius:50%;padding:18%;stroke-width:2.6}
@keyframes fadein{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const land=()=>innerWidth>innerHeight*1.15;

/* ---------- Speicher ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
const S=Object.assign({speak:true,sound:true,saver:true,hint:true,idle:120,cc:'43',speed:.8},lsGet('et_settings',{}));
const saveS=()=>lsSet('et_settings',S);
let contacts=lsGet('et_contacts',[]);
const saveC=()=>lsSet('et_contacts',contacts);

let dbp=null;const memStore=[];
function idb(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('einfach-tablet',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function dbAll(){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return memStore}}
async function dbAdd(rec){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').add(rec);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){rec.id=Date.now()+Math.random();memStore.push(rec)}}
async function dbClear(){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}memStore.length=0}
let photoList=null;
async function getPhotos(){if(photoList)return photoList;const recs=await dbAll();
  photoList=recs.map(r=>({id:r.id,full:URL.createObjectURL(r.full),thumb:URL.createObjectURL(r.thumb||r.full)}));return photoList}
function resetPhotos(){if(photoList)photoList.forEach(p=>{URL.revokeObjectURL(p.full);URL.revokeObjectURL(p.thumb)});photoList=null}
async function resize(file,max,square){try{
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  let w=bmp.width,h=bmp.height,sx=0,sy=0,sw=w,sh=h;
  if(square){const s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=sh=s;w=h=s}
  const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');
  c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85))}catch(e){return file}}
const toDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)});

/* ---------- Ton & Sprache ---------- */
function speak(t,force){if((!S.speak&&!force)||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
let actx=null;
function tone(freqs,step=.12,len=.5,vol=.18,type='sine'){if(!S.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();
  freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;const t=actx.currentTime+i*step;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+len);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+len+.05)})}catch(e){}}
const chime=()=>tone([523,659,784]);
const ding=()=>tone([660,880],.08,.35);
const popSnd=()=>tone([900,500],.04,.15,.15,'triangle');

/* ---------- Fehlertolerantes Tippen ----------
   Ein Tipp zählt erst beim Loslassen und nur, wenn der Finger noch auf derselben Fläche ist.
   Mehrere Finger gleichzeitig (z.B. Handballen) werden ignoriert. Doppeltipps innerhalb 350 ms zählen einmal. */
const A={};let downEl=null,pointers=new Set(),multi=false,lastTap=0;
document.addEventListener('pointerdown',e=>{
  if(e.isPrimary)pointers.clear();pointers.add(e.pointerId);
  resetIdle();cornerCheck(e);
  if(pointers.size>1){multi=true;if(downEl)downEl.classList.remove('pressed');downEl=null;return}
  multi=false;const el=e.target.closest('[data-tap]');if(el){downEl=el;el.classList.add('pressed')}},true);
document.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);const el=downEl;downEl=null;if(!el)return;el.classList.remove('pressed');
  if(multi)return;const over=document.elementFromPoint(e.clientX,e.clientY);if(!over||over.closest('[data-tap]')!==el)return;
  const now=Date.now();if(now-lastTap<350)return;lastTap=now;const fn=A[el.dataset.tap];if(fn)fn(el.dataset.arg,el)},true);
document.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(downEl)downEl.classList.remove('pressed');downEl=null},true);

/* ---------- Ecken-Geste: ↖ ↗ ↘ ↙ innerhalb von 8 Sekunden ---------- */
let cseq=0,ct=0;
function cornerCheck(e){const w=innerWidth,h=innerHeight,s=Math.max(70,Math.min(w,h)*.11),x=e.clientX,y=e.clientY;
  let c=-1;if(x<s&&y<s)c=0;else if(x>w-s&&y<s)c=1;else if(x>w-s&&y>h-s)c=2;else if(x<s&&y>h-s)c=3;
  const now=Date.now();if(now-ct>8000)cseq=0;
  if(c===cseq){if(c===0)ct=now;cseq++;if(cseq===4){cseq=0;setTimeout(()=>{if(cur.name!=='admin')go('admin')},60)}}
  else{cseq=c===0?1:0;if(c===0)ct=now}}

/* ---------- Bewegungsspiele ----------
   Gemeinsame Regeln: ein Finger reicht, überall auf der Spielfläche. Kein „Game Over“,
   Fehler kosten keine Punkte. Tempo in den Einstellungen wählbar. */
const EFONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emo(ctx,ch,x,y,size,flip,rot,alpha){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);
  if(alpha!=null)ctx.globalAlpha=alpha;ctx.font=`${Math.round(size)}px ${EFONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,0,size*.06);ctx.restore()}
function arcade(icon,label,make){
  app.innerHTML=bar(icon,label)+`<div class="main"><div class="drawwrap" id="gw"><canvas id="gc" style="display:block;touch-action:none"></canvas></div></div>`;
  const cv=$('#gc'),ctx=cv.getContext('2d'),wrap=$('#gw');
  const st={W:1,H:1,m:1,score:0,px:null,py:null,t:0,
    hit(){st.score++;if(st.score%10===0)celebrate();else ding()}};
  const game=make(ctx,st);
  const fit=()=>{const r=wrap.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=Math.floor(r.width*dpr);cv.height=Math.floor(r.height*dpr);
    cv.style.width=r.width+'px';cv.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);st.W=r.width;st.H=r.height;st.m=Math.min(r.width,r.height);game.resize&&game.resize()};
  fit();resizeHook=fit;
  let pid=null;const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{if(pid!==null)return;pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(_){}
    const p=pt(e);st.px=p.x;st.py=p.y;game.tap&&game.tap(p)});
  cv.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;const p=pt(e);st.px=p.x;st.py=p.y});
  const end=e=>{if(e.pointerId===pid)pid=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  const g=gen;let last=performance.now();
  const loop=t=>{if(g!==gen)return;const dt=Math.min(.05,(t-last)/1000)*(+S.speed||.8);last=t;st.t+=dt;
    game.step(dt);ctx.clearRect(0,0,st.W,st.H);game.draw();
    ctx.font=`700 ${Math.round(st.m*.055)}px "Atkinson Hyperlegible",system-ui,sans-serif`;ctx.textAlign='right';ctx.textBaseline='top';ctx.fillStyle='#5F6B76';
    ctx.fillText('Punkte: '+st.score,st.W-16,12);
    if(st.t<4&&game.hint){emo(ctx,game.hint,st.W/2,st.H*.18,st.m*.14,false,0,Math.max(0,1-st.t/4))}
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop)}

/* Ball: Brett folgt dem Finger, Ball abprallen lassen (wie Pong, gegen die Wand) */
screens.ball=()=>arcade('ball','Ball',(ctx,st)=>{let b=null,pad={x:0,y:0,w:0,h:0};
  const reset=()=>{b={x:st.W/2,y:st.H*.15,r:st.m*.055,vx:(Math.random()<.5?-1:1)*st.H*.18,vy:st.H*.32}};
  return{hint:'👆',resize(){if(!b)reset()},
    step(dt){const pw=Math.max(st.W*.3,170),ph=st.m*.05;pad={x:Math.max(pw/2,Math.min(st.W-pw/2,st.px??st.W/2)),y:st.H-ph*1.8,w:pw,h:ph};
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>st.W-b.r){b.x=st.W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
      if(b.vy>0&&b.y+b.r>=pad.y-pad.h/2&&b.y<pad.y+pad.h/2&&Math.abs(b.x-pad.x)<pad.w/2+b.r*.7){
        b.vy=-Math.abs(b.vy);b.vx=((b.x-pad.x)/(pad.w/2))*st.H*.3;st.hit()}
      if(b.y-b.r>st.H)reset()},
    draw(){ctx.fillStyle='#2F6690';ctx.beginPath();ctx.roundRect(pad.x-pad.w/2,pad.y-pad.h/2,pad.w,pad.h,pad.h/2);ctx.fill();
      emo(ctx,'⚽',b.x,b.y,b.r*2)}}});

/* Hüpfen: irgendwo tippen = springen, über Hindernisse (wie das Dino-Spiel) */
screens.hop=()=>arcade('hop','Springen',(ctx,st)=>{let y=0,vy=0,obs=[],next=2;
  return{hint:'👆',
    tap(){if(y<=1){const s=st.m*.16;vy=s*6.5}},
    step(dt){const s=st.m*.16,g=s*9,v=st.W*.2;vy-=g*dt;y+=vy*dt;if(y<0){y=0;vy=0}
      next-=dt;if(next<=0){obs.push({x:st.W+s,ch:pick(['🌵','📦','🚧']),hit:false,passed:false});next=2+Math.random()*1.8}
      const rx=st.W*.18;
      obs.forEach(o=>{o.x-=v*dt;
        if(!o.hit&&!o.passed&&Math.abs(o.x-rx)<s*.55&&y<s*.55){o.hit=true;tone([300],.1,.2,.12)}
        if(!o.passed&&o.x<rx-s*.6){o.passed=true;if(!o.hit)st.hit()}});
      obs=obs.filter(o=>o.x>-s)},
    draw(){const s=st.m*.16,G=st.H*.8,rx=st.W*.18;
      ctx.strokeStyle='#c7c7cd';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(st.W,G);ctx.stroke();
      obs.forEach(o=>emo(ctx,o.ch,o.x,G-s*.4,s*.8,false,0,o.hit?.3:1));
      emo(ctx,'🏃',rx,G-s*.5-y,s,true)}}});

/* Weltraum: Rakete folgt dem Finger und schießt von selbst (wie Space Invaders, nur gemütlich) */
screens.space=()=>arcade('space','Weltraum',(ctx,st)=>{let sx=null,shots=[],al=[],fire=0,spawn=.5;
  return{hint:'👆',
    step(dt){const s=st.m*.13;if(sx===null)sx=st.W/2;const tx=st.px??sx;sx+=(tx-sx)*Math.min(1,dt*8);
      const sy=st.H-s*.8;fire-=dt;if(fire<=0){shots.push({x:sx,y:sy-s*.5});fire=.5}
      shots.forEach(p=>p.y-=st.H*.9*dt);shots=shots.filter(p=>p.y>-20);
      spawn-=dt;if(spawn<=0&&al.length<5){al.push({x:s/2+Math.random()*(st.W-s),y:-s/2,vx:(Math.random()-.5)*st.W*.08,ch:pick(['👾','🛸','☄️']),boom:0});spawn=1.5}
      al.forEach(a=>{if(a.boom){a.boom-=dt;return}a.y+=st.H*.07*dt;a.x+=a.vx*dt;if(a.x<s/2||a.x>st.W-s/2)a.vx*=-1;
        for(const p of shots){if(!p.used&&Math.hypot(p.x-a.x,p.y-a.y)<s*.6){p.used=true;a.boom=.4;popSnd();st.hit();break}}});
      shots=shots.filter(p=>!p.used);al=al.filter(a=>a.y<st.H+s&&!(a.boom<0))},
    draw(){const s=st.m*.13;ctx.fillStyle='#fb8c00';shots.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,s*.09,0,7);ctx.fill()});
      al.forEach(a=>emo(ctx,a.boom?'💥':a.ch,a.x,a.y,s));emo(ctx,'🚀',sx??st.W/2,st.H-s*.8,s,false,-Math.PI/4)}}});

/* Futter sammeln: Maus folgt dem Finger und sammelt Käse (wie Pac-Man, ohne Labyrinth).
   Ab 8 Punkten schleicht eine langsame Katze herum – erwischt sie die Maus, läuft sie nur weg. */
screens.mouse=()=>arcade('mouse','Sammeln',(ctx,st)=>{let m=null,face=1,food=[],cat=null;
  const rnd=s=>({x:s+Math.random()*(st.W-2*s),y:s+Math.random()*(st.H-2*s)});
  const corner=()=>{const c=[[0,0],[st.W,0],[st.W,st.H],[0,st.H]].map(([x,y])=>({x,y,d:Math.hypot(x-m.x,y-m.y)})).sort((a,b)=>b.d-a.d)[0];
    const s=st.m*.13;return{x:Math.min(st.W-s,Math.max(s,c.x)),y:Math.min(st.H-s,Math.max(s,c.y))}};
  return{hint:'👆',resize(){if(!m)m={x:st.W/2,y:st.H/2}},
    step(dt){const s=st.m*.13,sp=st.m*.6;
      if(st.px!=null){const dx=st.px-m.x,dy=st.py-m.y,d=Math.hypot(dx,dy);if(d>2){const k=Math.min(d,sp*dt)/d;m.x+=dx*k;m.y+=dy*k;if(Math.abs(dx)>4)face=dx>0?1:-1}}
      while(food.length<3)food.push(rnd(s));
      food=food.filter(f=>{if(Math.hypot(f.x-m.x,f.y-m.y)<s*.7){st.hit();return false}return true});
      if(st.score>=8&&!cat)cat=corner();
      if(cat){const dx=m.x-cat.x,dy=m.y-cat.y,d=Math.hypot(dx,dy);const k=Math.min(d,sp*.3*dt)/(d||1);cat.x+=dx*k;cat.y+=dy*k;cat.f=dx>0?1:-1;
        if(d<s*.6){tone([300],.1,.2,.12);const c=corner();cat.x=c.x;cat.y=c.y}}},
    draw(){const s=st.m*.13;food.forEach(f=>emo(ctx,'🧀',f.x,f.y,s*.8));if(cat)emo(ctx,'🐈',cat.x,cat.y,s*1.1,cat.f>0);
      emo(ctx,'🐭',m.x,m.y,s,face>0)}}});

  const cv=$('#cv'),ctx=cv.getContext('2d'),wrap=$('#dw');
  const fit=()=>{const r=wrap.getBoundingClientRect(),dpr=devicePixelRatio||1;let tmp=null;
    if(cv.width){tmp=document.createElement('canvas');tmp.width=cv.width;tmp.height=cv.height;tmp.getContext('2d').drawImage(cv,0,0)}

    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);if(tmp)ctx.drawImage(tmp,0,0,tmp.width/dpr,tmp.height/dpr)};
  fit();resizeHook=fit;
  let pid=null,last=null;const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};

    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()};
  cv.addEventListener('pointerdown',e=>{if(pid!==null)return;pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(_){}last=pt(e);stroke(last,{x:last.x+.1,y:last.y})});
  cv.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;const p=pt(e);stroke(last,p);last=p});

   <p><b>Einstellungen öffnen:</b> nacheinander die vier Ecken antippen: links oben → rechts oben → rechts unten → links unten (innerhalb von 8 Sekunden).</p>
   <p><b>Nachrichten:</b> Er tippt auf eine Person, dann auf ein Symbol, dann auf das grüne ✔. WhatsApp öffnet sich mit dem Text, dort muss noch auf „Senden“ getippt werden.</p>
   <p><b>Schreiben:</b> Große Tastatur und Wort-Knöpfe. 🔊 liest den Text vor (auch wenn „Tasten vorlesen“ aus ist), 💬 schickt ihn an einen Kontakt, 🗑️ löscht ihn nach Bestätigung.</p>
   <p><b>Prototyp:</b> Die Bildschirmsperre ist noch nicht aktiv. Sie kommt mit der Android-App (Startbildschirm-App + Anheften bzw. Kiosk-Modus).</p></div></section>
  </div>`;
  renderCList();
  $('#cPhoto').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const b=await resize(f,300,true);pendingPhoto=await toDataURL(b);
    const p=$('#cPrev');if(p&&pendingPhoto){p.src=pendingPhoto;p.style.display='inline-block'}});
  $('#pAdd').addEventListener('change',async e=>{const fs=[...e.target.files];const pc=$('#pcount');let k=0;
    for(const f of fs){k++;if(pc)pc.textContent=`Speichere Bild ${k} von ${fs.length} …`;const full=await resize(f,1920),thumb=await resize(f,420,true);await dbAdd({full,thumb})}
    resetPhotos();e.target.value='';updCount()});
  const bind=(id,key,conv)=>$('#'+id).addEventListener('change',e=>{S[key]=conv(e.target);saveS();resetIdle()});
  bind('sSpeak','speak',t=>t.checked);bind('sSound','sound',t=>t.checked);bind('sSaver','saver',t=>t.checked);bind('sHint','hint',t=>t.checked);
  bind('sIdle','idle',t=>+t.value);bind('sSpeed','speed',t=>+t.value);bind('sCC','cc',t=>t.value.replace(/\D/g,'')||'43');
  updCount()};
async function updCount(){const p=await getPhotos();const el=$('#pcount');if(el)el.textContent=p.length?`${p.length} Bilder gespeichert.`:'Noch keine Bilder.'}
function renderCList(){const el=$('#clist');if(!el)return;
  el.innerHTML=contacts.length?contacts.map((c,i)=>`<div class="crow">${avatar(c)}<div class="meta"><b>${esc(c.name)}</b><small>${esc(c.phone)} · ${c.app==='signal'?'Signal':'WhatsApp'}</small></div>
   ${i>0?`<div class="abtn light sm" data-tap="moveUp" data-arg="${i}">⬆</div>`:''}<div class="abtn red sm" data-tap="delContact" data-arg="${i}">Entfernen</div></div>`).join('')
   :'<p class="note">Noch keine Kontakte.</p>'}
A.pickEmo=(e,el)=>{pendingEmoji=e;pendingPhoto=null;document.querySelectorAll('#cEmo span').forEach(s=>s.classList.toggle('sel',s===el));
  const p=$('#cPrev');if(p)p.style.display='none';const f=$('#cPhoto');if(f)f.value=''};
A.addContact=()=>{const name=$('#cName').value.trim(),phone=$('#cPhone').value.trim(),m=$('#cMsg');
  if(!name){m.className='msg';m.textContent='Bitte einen Namen eingeben.';return}
  if(normNum(phone).length<8){m.className='msg';m.textContent='Bitte eine Handynummer eingeben, am besten mit +43 …';return}
  contacts.push({name,phone,app:$('#cApp').value,emoji:pendingEmoji,photo:pendingPhoto});
  if(!saveC()){m.className='msg';m.textContent='Konnte nicht dauerhaft speichern (Speicher dieses Browsers voll oder gesperrt).'}
  else{m.className='msg ok';m.textContent='✔ Gespeichert: '+name}
  pendingPhoto=null;$('#cName').value='';$('#cPhone').value='';$('#cPhoto').value='';$('#cPrev').style.display='none';renderCList()};
A.delContact=i=>{const c=contacts[+i];if(!c)return;confirmBox({big:'🗑️',text:c.name+' entfernen?',onYes:()=>{contacts.splice(+i,1);saveC();renderCList()}})};
A.moveUp=i=>{i=+i;if(i<1)return;[contacts[i-1],contacts[i]]=[contacts[i],contacts[i-1]];saveC();renderCList()};
A.clearPhotos=()=>confirmBox({big:'🖼️🗑️',text:'Alle Bilder entfernen?',onYes:async()=>{await dbClear();resetPhotos();updCount()}});
A.fullscreen=()=>{try{const d=document.documentElement;const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(p&&p.catch)p.catch(()=>{})}catch(e){}};
A.adminDone=()=>go('home');

/* Offline-Fähigkeit & dauerhafter Speicher, wenn als Web-App installiert */
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
go('home');
</script>
